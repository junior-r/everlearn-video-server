# LiveKit SFU config for local development. API keys come from the LIVEKIT_KEYS env var.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
logging:
  level: info
# Shared with Egress, which records classes
redis:
  address: redis:6379
# Room and participant events go to the video-server, signed with this key's secret
webhook:
  api_key: devkey
  urls:
    - http://video-server:8080/webhooks/livekit
